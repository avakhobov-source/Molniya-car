<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Молния</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#7fd8ff;}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;font-family:system-ui,sans-serif}
canvas{display:block;width:100%;height:100%}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function(){
var tg=null;
try{tg=window.Telegram&&window.Telegram.WebApp;if(tg){tg.ready();tg.expand();try{tg.disableVerticalSwipes();}catch(e){}}}catch(e){}
var cv=document.getElementById('c'),ctx=cv.getContext('2d'),W,H,D,rw,rx,lw,cw,ch,cy;
function geo(){rw=Math.min(W*0.92,400);rx=(W-rw)/2;lw=rw/3;cw=lw*0.6;ch=cw*1.75;cy=H*0.78;}
function resize(){D=window.devicePixelRatio||1;W=innerWidth;H=innerHeight;cv.width=W*D;cv.height=H*D;ctx.setTransform(D,0,0,D,0,0);geo();}
addEventListener('resize',resize);resize();

var SHARE_URL=''; // после запуска в Telegram вставь сюда ссылку t.me/твой_бот/название
var S={coins:0,car:0,owned:[0],best:0};
try{var _s=JSON.parse(localStorage.getItem('car_save')||'null');if(_s)for(var k in _s)S[k]=_s[k];}catch(e){}
function save(){try{localStorage.setItem('car_save',JSON.stringify(S));}catch(e){}}

var CARS=[{n:'Молния',c:'#ff3b30',p:0,t:0},{n:'Такси',c:'#ffd60a',p:30,t:1},{n:'Полиция',c:'#2979ff',p:60,t:2},{n:'Пожарная',c:'#ff6d00',p:100,t:3}];
var WORLDS=[{n:'🏙️ Город',side:'#7ed957',road:'#5a5f6b'},{n:'🏜️ Пустыня',side:'#f7d488',road:'#7a6048'},{n:'❄️ Снег',side:'#f4fbff',road:'#6c7c95'},{n:'🌈 Космос',side:'#2b1b72',road:'#33356b'}];
var OTHER=['#7c4dff','#00c853','#ff4081','#00b8d4','#ff9100'];

var state='menu',items,pops,fuel,dist,run,turbo,bump,carX,px,spawnT,sc,lastW,t=0,btns=[],msg='',msgT=0,actx=null;
function reset(){items=[];pops=[];fuel=100;dist=0;run=0;turbo=0;bump=0;carX=W/2;px=W/2;spawnT=H*0.2;sc=0;lastW=0;}
reset();

function initAudio(){try{if(!actx)actx=new (window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume();}catch(e){}}
function beep(f,d,type){try{if(!actx)return;var o=actx.createOscillator(),g=actx.createGain();o.type=type||'sine';o.frequency.value=f;g.gain.setValueAtTime(0.12,actx.currentTime);g.gain.exponentialRampToValueAtTime(0.001,actx.currentTime+d);o.connect(g);g.connect(actx.destination);o.start();o.stop(actx.currentTime+d);}catch(e){}}
function buzz(k){try{tg&&tg.HapticFeedback&&tg.HapticFeedback.notificationOccurred(k);}catch(e){}}
function satop(){try{return ((tg.safeAreaInset||{}).top||0)+((tg.contentSafeAreaInset||{}).top||0);}catch(e){return 0;}}
function toast(m){msg=m;msgT=performance.now()+1800;}
function pop(x,y,txt,col){pops.push({x:x,y:y,txt:txt,col:col,life:1});}
function rr(x,y,w,h,r){ctx.beginPath();if(ctx.roundRect)ctx.roundRect(x,y,w,h,r||12);else ctx.rect(x,y,w,h);}

function spawnRow(){
  var o=Math.floor(Math.random()*3),r=Math.random();
  if(r<0.75){var q=Math.random();items.push({k:q<0.4?'cone':q<0.7?'box':'car',l:o,y:-ch,col:OTHER[Math.floor(Math.random()*OTHER.length)]});}
  var l2=(o+1+Math.floor(Math.random()*2))%3,z=Math.random();
  if(z<0.32)items.push({k:'fuel',l:l2,y:-ch});
  else if(z<0.82)items.push({k:'coin',l:l2,y:-ch});
  else if(z<0.9)items.push({k:'turbo',l:l2,y:-ch});
}

function update(dt){
  t+=dt;
  var base=H*0.34+Math.min(H*0.12,dist/20);
  var v=base*(turbo>0?1.7:1)*(bump>0?0.45:1);
  sc+=v*dt;dist+=v*dt/40;
  if(turbo<=0)fuel-=dt*2.2;
  if(turbo>0)turbo-=dt;if(bump>0)bump-=dt;
  spawnT-=v*dt;if(spawnT<=0){spawnRow();spawnT=H*0.34;}
  px+=(carX-px)*Math.min(1,10*dt);
  px=Math.max(rx+cw/2,Math.min(rx+rw-cw/2,px));
  for(var i=items.length-1;i>=0;i--){
    var it=items[i];it.y+=v*dt;var ix=rx+lw*(it.l+0.5);
    if(Math.abs(ix-px)<lw*0.42&&Math.abs(it.y-cy)<ch*0.5){
      if(it.k==='coin'){run++;S.coins++;beep(880,.08);}
      else if(it.k==='fuel'){fuel=Math.min(100,fuel+30);pop(ix,it.y,'+⛽','#00a152');beep(520,.18);}
      else if(it.k==='turbo'){turbo=3.5;pop(ix,it.y,'ТУРБО!','#ff6d00');beep(990,.25);buzz('success');}
      else if(turbo>0){pop(ix,it.y,'Вжух!','#7c4dff');beep(600,.1);}
      else{bump=0.6;fuel=Math.max(0,fuel-8);pop(ix,it.y,'Бам!','#d50000');beep(140,.25,'sawtooth');buzz('error');}
      items.splice(i,1);
    }else if(it.y>H+60)items.splice(i,1);
  }
  for(var j=pops.length-1;j>=0;j--){pops[j].y-=45*dt;pops[j].life-=dt*1.1;if(pops[j].life<=0)pops.splice(j,1);}
  var wi=Math.floor(dist/400)%4;
  if(wi!==lastW){lastW=wi;pop(W/2,H*0.3,WORLDS[wi].n,'#fff');beep(700,.3);}
  if(fuel<=0){state='refuel';if(dist>S.best)S.best=Math.floor(dist);save();}
}

function drawCar(x,y,w,c,type){
  var h=w*1.75;ctx.save();ctx.translate(x,y);
  ctx.fillStyle='#222';[[-1,-.28],[1,-.28],[-1,.2],[1,.2]].forEach(function(p){rr(p[0]*w*0.5-w*0.08,p[1]*h-h*0.11,w*0.16,h*0.22,4);ctx.fill();});
  ctx.fillStyle=c;rr(-w/2,-h/2,w,h,w*0.3);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.35)';rr(-w*0.38,-h*0.46,w*0.2,h*0.9,6);ctx.fill();
  ctx.fillStyle='#bfeaff';rr(-w*0.34,-h*0.22,w*0.68,h*0.2,6);ctx.fill();
  ctx.fillStyle='#8fd0f0';rr(-w*0.3,h*0.14,w*0.6,h*0.14,5);ctx.fill();
  ctx.fillStyle='#fff59d';ctx.beginPath();ctx.arc(-w*0.27,-h*0.44,w*0.08,0,7);ctx.arc(w*0.27,-h*0.44,w*0.08,0,7);ctx.fill();
  ctx.fillStyle='#ff1744';ctx.fillRect(-w*0.4,h*0.43,w*0.2,h*0.04);ctx.fillRect(w*0.2,h*0.43,w*0.2,h*0.04);
  if(type===1){ctx.fillStyle='#fff';rr(-w*0.2,-h*0.02,w*0.4,h*0.08,4);ctx.fill();}
  if(type===2){ctx.fillStyle='#ff1744';ctx.fillRect(-w*0.24,-h*0.02,w*0.24,h*0.07);ctx.fillStyle='#00b0ff';ctx.fillRect(0,-h*0.02,w*0.24,h*0.07);}
  if(type===3){ctx.fillStyle='#fff';ctx.fillRect(-w*0.14,0,w*0.05,h*0.4);ctx.fillRect(w*0.09,0,w*0.05,h*0.4);for(var i=0;i<4;i++)ctx.fillRect(-w*0.14,h*(0.05+i*0.1),w*0.28,h*0.02);}
  ctx.restore();
}
function disc(x,y,r,col){ctx.fillStyle=col;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();}
function drawItem(it){
  var x=rx+lw*(it.l+0.5),y=it.y,s=lw*0.3;
  if(it.k==='cone'){ctx.fillStyle='#ff6d00';ctx.beginPath();ctx.moveTo(x,y-s);ctx.lineTo(x+s*0.8,y+s*0.8);ctx.lineTo(x-s*0.8,y+s*0.8);ctx.fill();ctx.fillStyle='#fff';ctx.fillRect(x-s*0.4,y,s*0.8,s*0.25);ctx.fillStyle='#e65100';ctx.fillRect(x-s,y+s*0.7,s*2,s*0.3);}
  else if(it.k==='box'){ctx.fillStyle='#c68642';rr(x-s,y-s,s*2,s*2,6);ctx.fill();ctx.strokeStyle='#8d5a1f';ctx.lineWidth=4;ctx.strokeRect(x-s+4,y-s+4,s*2-8,s*2-8);ctx.beginPath();ctx.moveTo(x-s,y-s);ctx.lineTo(x+s,y+s);ctx.moveTo(x+s,y-s);ctx.lineTo(x-s,y+s);ctx.stroke();}
  else if(it.k==='car')drawCar(x,y,cw,it.col,-1);
  else{
    var col=it.k==='fuel'?'rgba(0,200,83,.45)':it.k==='coin'?'rgba(255,214,0,.55)':'rgba(255,109,0,.5)';
    disc(x,y,s*1.1+Math.sin(t*6)*2,col);ctx.font=Math.round(s*1.5)+'px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(it.k==='fuel'?'⛽':it.k==='coin'?'🪙':'⚡',x,y+2);ctx.textBaseline='alphabetic';
  }
}
function scenery(w){
  ctx.fillStyle=w.side;ctx.fillRect(0,0,W,H);
  ctx.fillStyle=w.road;ctx.fillRect(rx,0,rw,H);
  ctx.fillStyle='#fff';ctx.fillRect(rx-5,0,5,H);ctx.fillRect(rx+rw,0,5,H);
  ctx.fillStyle='rgba(255,255,255,.85)';
  var off=sc%80;
  for(var l=1;l<3;l++)for(var y=-80+off;y<H;y+=80)ctx.fillRect(rx+lw*l-3,y,6,40);
  if(rx<34)return;
  var di=WORLDS.indexOf(w);
  for(var i=0;i<Math.ceil(H/110)+2;i++){
    var y2=((i*110+sc)%(H+110))-55;
    [rx/2,rx+rw+rx/2].forEach(function(x,sd){
      var hh=(i*3+sd)%3;
      if(di===0){ctx.fillStyle=['#ff7043','#42a5f5','#ffca28'][hh];rr(x-16,y2-16,32,32,5);ctx.fill();ctx.fillStyle='#fff';ctx.fillRect(x-8,y2-6,8,8);}
      else if(di===1){ctx.fillStyle='#2e9d3f';rr(x-4,y2-18,8,36,4);ctx.fill();ctx.fillRect(x-14,y2-8,10,5);ctx.fillRect(x+4,y2-12,10,5);}
      else if(di===2){ctx.fillStyle='#2e9d6a';ctx.beginPath();ctx.moveTo(x,y2-22);ctx.lineTo(x+16,y2+12);ctx.lineTo(x-16,y2+12);ctx.fill();ctx.fillStyle='#8d5a1f';ctx.fillRect(x-3,y2+12,6,8);}
      else{ctx.fillStyle=['#fff59d','#80deea','#f48fb1'][hh];ctx.font='22px system-ui';ctx.textAlign='center';ctx.fillText('✦',x,y2);}
    });
  }
  if(di===3){var cols=['#ff1744','#ffd600','#00e676','#2979ff'];for(var c=0;c<4;c++){ctx.fillStyle=cols[c];ctx.fillRect(rx-5-c*0,0,0,0);}}
}
function stroked(txt,x,y){ctx.lineWidth=5;ctx.strokeStyle='#fff';ctx.strokeText(txt,x,y);ctx.fillStyle='#222';ctx.fillText(txt,x,y);}
function hud(){
  var top=14+satop();
  ctx.font='22px system-ui';ctx.textAlign='left';ctx.fillText('⛽',14,top+22);
  var bw=Math.min(170,W*0.4);ctx.fillStyle='rgba(255,255,255,.8)';rr(44,top+4,bw,20,10);ctx.fill();
  var fc=fuel>50?'#00c853':fuel>25?'#ffd600':(Math.floor(t*6)%2?'#ff1744':'#ff8a80');
  ctx.fillStyle=fc;rr(44,top+4,Math.max(8,bw*fuel/100),20,10);ctx.fill();
  ctx.font='bold 20px system-ui';ctx.textAlign='right';stroked('🪙 '+S.coins,W-14,top+22);
  ctx.textAlign='center';ctx.font='bold 18px system-ui';stroked(Math.floor(dist)+' м',W/2,top+52);
  if(fuel<25&&state==='play'){ctx.font='bold 18px system-ui';stroked('Лови ⛽!',W/2,top+80);}
}
function btn(x,y,w,h,label,fn,primary){btns.push({x:x,y:y,w:w,h:h,fn:fn});ctx.fillStyle=primary?'#ffd600':'#8e5cf7';rr(x,y,w,h,14);ctx.fill();ctx.fillStyle=primary?'#222':'#fff';ctx.font='bold 18px system-ui';ctx.textAlign='center';ctx.fillText(label,x+w/2,y+h/2+6);}
function share(){var url=SHARE_URL||(location.origin+location.pathname),text='Покатай Молнию! Мой рекорд: '+S.best+' м 🏎️';var link='https://t.me/share/url?url='+encodeURIComponent(url)+'&text='+encodeURIComponent(text);
  try{if(tg&&tg.openTelegramLink){tg.openTelegramLink(link);return;}}catch(e){}
  if(navigator.share){navigator.share({title:'Молния',text:text,url:url}).catch(function(e){if(!e||e.name!=='AbortError')copyLink(url,text);});return;}
  copyLink(url,text);}
function copyLink(url,text){var s=text+' '+url;try{navigator.clipboard.writeText(s).then(function(){toast('Ссылка скопирована');},function(){toast(url);});}catch(e){toast(url);}}
function play(){reset();state='play';}
function carTap(i){if(S.owned.indexOf(i)>=0){S.car=i;save();}else if(S.coins>=CARS[i].p){S.coins-=CARS[i].p;S.owned.push(i);S.car=i;save();toast('Новая машина!');}else toast('Мало монет 🪙');}

function overlay(){
  btns=[];ctx.fillStyle='rgba(70,25,140,.55)';ctx.fillRect(0,0,W,H);
  var bw=Math.min(280,W-48),bx=(W-bw)/2,y=Math.max(20,H/2-200);
  ctx.textAlign='center';ctx.fillStyle='#fff';
  if(state==='menu'){
    ctx.font='bold 38px system-ui';ctx.fillText('Молния 🏎️',W/2,y+36);
    var c=CARS[S.car];drawCar(W/2,y+120+Math.sin(t*3)*4,cw*1.1,c.c,c.t);
    ctx.fillStyle='#fff';ctx.font='15px system-ui';ctx.fillText('Монет: '+S.coins+' 🪙  ·  Рекорд: '+S.best+' м',W/2,y+205);
    y+=225;btn(bx,y,bw,52,'🏁 Ехать!',play,true);y+=64;
    btn(bx,y,bw,48,'🚗 Гараж',function(){state='garage';});y+=60;
    btn(bx,y,bw,48,'👥 Позвать друга',function(){share();});y+=64;
    ctx.fillStyle='#fff';ctx.font='13px system-ui';ctx.fillText('Води пальцем влево и вправо. Лови ⛽ и 🪙',W/2,y);
  }else if(state==='garage'){
    ctx.font='bold 26px system-ui';ctx.fillText('Гараж',W/2,44);ctx.font='16px system-ui';ctx.fillText('Монет: '+S.coins+' 🪙',W/2,70);
    var tw=Math.min(150,(W-48)/2),th=Math.min(170,(H-230)/2),gx=(W-tw*2-12)/2;
    for(var i=0;i<4;i++)(function(i){var tx=gx+(i%2)*(tw+12),ty=90+Math.floor(i/2)*(th+12);
      ctx.fillStyle=S.car===i?'rgba(255,214,0,.45)':'rgba(255,255,255,.15)';rr(tx,ty,tw,th,16);ctx.fill();
      btns.push({x:tx,y:ty,w:tw,h:th,fn:function(){carTap(i);}});
      drawCar(tx+tw/2,ty+th*0.42,Math.min(50,th*0.3),CARS[i].c,CARS[i].t);
      ctx.fillStyle='#fff';ctx.font='bold 16px system-ui';ctx.textAlign='center';ctx.fillText(CARS[i].n,tx+tw/2,ty+th-34);
      ctx.font='14px system-ui';ctx.fillText(S.car===i?'Выбрана ✔':S.owned.indexOf(i)>=0?'Выбрать':CARS[i].p+' 🪙',tx+tw/2,ty+th-12);})(i);
    btn(bx,90+2*(th+12)+4,bw,46,'← Назад',function(){state='menu';});
  }else{
    ctx.font='bold 28px system-ui';ctx.fillText('⛽ Бензин закончился!',W/2,y+60);
    ctx.font='20px system-ui';ctx.fillText('Ты проехал '+Math.floor(dist)+' м',W/2,y+100);ctx.fillText('Собрал монет: '+run+' 🪙',W/2,y+130);
    y+=170;btn(bx,y,bw,52,'⛽ Заправиться и ехать',function(){fuel=70;items=[];bump=0;state='play';},true);y+=64;
    btn(bx,y,bw,48,'🏠 В меню',function(){state='menu';});y+=60;
    btn(bx,y,bw,48,'👥 Позвать друга',function(){share();});
  }
  if(performance.now()<msgT){ctx.fillStyle='rgba(0,0,0,.8)';rr(W/2-120,H-70,240,36,12);ctx.fill();ctx.fillStyle='#fff';ctx.font='15px system-ui';ctx.textAlign='center';ctx.fillText(msg,W/2,H-47);}
}

function draw(){
  var w=WORLDS[state==='play'||state==='refuel'?lastW:0];scenery(w);
  items.forEach(drawItem);
  if(state!=='menu'&&state!=='garage'){
    var sh=bump>0?Math.sin(t*50)*5:0;
    if(turbo>0){var cs=['#ff1744','#ff9100','#ffd600','#00e676','#2979ff','#aa00ff'];for(var j=0;j<6;j++){ctx.fillStyle=cs[j];ctx.fillRect(px-cw*0.4+j*cw*0.8/6,cy+ch*0.5,cw*0.8/6,ch*(0.9+Math.random()*0.5));}}
    var c=CARS[S.car];drawCar(px+sh,cy,cw,c.c,c.t);
    pops.forEach(function(p){ctx.globalAlpha=Math.max(0,p.life);ctx.font='bold 22px system-ui';ctx.textAlign='center';ctx.lineWidth=5;ctx.strokeStyle='#fff';ctx.strokeText(p.txt,p.x,p.y);ctx.fillStyle=p.col;ctx.fillText(p.txt,p.x,p.y);ctx.globalAlpha=1;});
    hud();
  }
  if(state!=='play')overlay();
}

var last=performance.now();
function loop(now){var dt=Math.min(0.05,(now-last)/1000);last=now;if(state==='play')update(dt);else t+=dt;geo();draw();requestAnimationFrame(loop);}
requestAnimationFrame(loop);

cv.addEventListener('pointerdown',function(e){e.preventDefault();initAudio();if(state==='play')carX=e.clientX;});
cv.addEventListener('pointermove',function(e){if(state==='play')carX=e.clientX;});
cv.addEventListener('click',function(e){if(state==='play')return;for(var i=0;i<btns.length;i++){var b=btns[i];if(e.clientX>=b.x&&e.clientX<=b.x+b.w&&e.clientY>=b.y&&e.clientY<=b.y+b.h){b.fn();return;}}});
addEventListener('keydown',function(e){if(e.key==='ArrowLeft')carX-=lw;if(e.key==='ArrowRight')carX+=lw;});
})();
</script>
</body>
</html>
