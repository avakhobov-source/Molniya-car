  copyLink(url,text);}
function copyLink(url,text){var s=text+' '+url;try{navigator.clipboard.writeText(s).then(function(){toast(T('Ссылка скопирована'));},function(){toast(url);});}catch(e){toast(url);}}
function play(){reset();state='play';}
function carTap(i){if(S.owned.indexOf(i)>=0){S.car=i;save();}else if(S.coins>=CARS[i].p){S.coins-=CARS[i].p;S.owned.push(i);S.car=i;save();toast(T('Новая машина!'));}else toast(T('Мало монет 💰'));}

function overlay(){
  btns=[];ctx.fillStyle='rgba(70,25,140,.55)';ctx.fillRect(0,0,W,H);
  var bw=Math.min(280,W-48),bx=(W-bw)/2,y=Math.max(20,H/2-200);
  ctx.textAlign='center';ctx.fillStyle='#fff';
  if(state==='menu'){
    ctx.font='bold 38px system-ui';ctx.fillText(T('Молния 🏎️'),W/2,y+36);
    var c=CARS[S.car];drawCar(W/2,y+120+Math.sin(t*3)*4,cw*1.1,c.c,c.t);
    ctx.fillStyle='#fff';ctx.font='15px system-ui';ctx.fillText(T('Монет: ')+S.coins+T(' 💰  ·  Рекорд: ')+S.best+T(' очков'),W/2,y+205);
    y+=225;btn(bx,y,bw,52,T('🏁 Ехать!'),play,true);y+=64;
    btn(bx,y,bw,48,T('🚗 Гараж'),function(){state='garage';});y+=60;
    btn(bx,y,bw,48,T('👥 Позвать друга (+50 💰)'),function(){share();});y+=64;
    ctx.fillStyle='#fff';ctx.font='13px system-ui';ctx.fillText(T('Води пальцем. Лови ⛽ 💰 ⚡ и не врезайся!'),W/2,y);
  }else if(state==='garage'){
    ctx.font='bold 26px system-ui';ctx.fillText(T('Гараж'),W/2,44);ctx.font='16px system-ui';ctx.fillText(T('Монет: ')+S.coins+' 💰',W/2,70);
    var tw=Math.min(150,(W-48)/2),th=Math.min(170,(H-230)/2),gx=(W-tw*2-12)/2;
    for(var i=0;i<4;i++)(function(i){var tx=gx+(i%2)*(tw+12),ty=90+Math.floor(i/2)*(th+12);
      ctx.fillStyle=S.car===i?'rgba(255,214,0,.45)':'rgba(255,255,255,.15)';rr(tx,ty,tw,th,16);ctx.fill();
      btns.push({x:tx,y:ty,w:tw,h:th,fn:function(){carTap(i);}});
      drawCar(tx+tw/2,ty+th*0.42,Math.min(50,th*0.3),CARS[i].c,CARS[i].t);
      ctx.fillStyle='#fff';ctx.font='bold 16px system-ui';ctx.textAlign='center';ctx.fillText(CARS[i].n,tx+tw/2,ty+th-34);ctx.font='12px system-ui';ctx.fillText(CARS[i].d,tx+tw/2,ty+th-52);ctx.font='14px system-ui';
      ctx.font='14px system-ui';ctx.fillText(S.car===i?T('Выбрана ✔'):S.owned.indexOf(i)>=0?T('Выбрать'):CARS[i].p+' 💰',tx+tw/2,ty+th-12);})(i);
    btn(bx,90+2*(th+12)+4,bw,46,T('← Назад'),function(){state='menu';});
  }else{
    ctx.font='bold 28px system-ui';ctx.fillText(lives<=0?T('💥 Авария!'):T('⛽ Бензин закончился!'),W/2,y+50);
    ctx.font='bold 36px system-ui';ctx.fillText(fin+T(' очков'),W/2,y+100);ctx.font='17px system-ui';ctx.fillText((newBest?T('🏆 Новый рекорд!'):T('Рекорд: ')+S.best)+'  ·  '+Math.floor(dist)+T(' м  ·  +')+run+' 💰',W/2,y+130);
    y+=170;btn(bx,y,bw,52,T('🏁 Ещё раз!'),play,true);y+=64;
    btn(bx,y,bw,48,T('🏠 В меню'),function(){state='menu';});y+=60;
    btn(bx,y,bw,48,T('👥 Позвать друга (+50 💰)'),function(){share();});
  }
  if(state==='menu'||state==='over'){var mx=W-56,my=10+satop();btns.push({x:mx,y:my,w:46,h:46,fn:function(){S.mute=S.mute?0:1;save();}});ctx.fillStyle='rgba(255,255,255,.22)';rr(mx,my,46,46,12);ctx.fill();ctx.font='22px system-ui';ctx.textAlign='center';ctx.fillStyle='#fff';ctx.fillText(S.mute?'🔇':'🔊',mx+23,my+31);}
  if(state==='menu'||state==='over'){var lx=W-112,ly=10+satop();btns.push({x:lx,y:ly,w:46,h:46,fn:LB.open});ctx.fillStyle='rgba(255,255,255,.22)';rr(lx,ly,46,46,12);ctx.fill();ctx.font='22px system-ui';ctx.textAlign='center';ctx.fillStyle='#fff';ctx.fillText('🏆',lx+23,ly+31);}
  if(performance.now()<msgT){ctx.fillStyle='rgba(0,0,0,.8)';rr(W/2-120,H-70,240,36,12);ctx.fill();ctx.fillStyle='#fff';ctx.font='15px system-ui';ctx.textAlign='center';ctx.fillText(msg,W/2,H-47);}
}

function draw(){
  ctx.save();if(shake>0)ctx.translate((Math.random()-.5)*16*shake,(Math.random()-.5)*16*shake);var w=WORLDS[state==='play'||state==='over'?lastW:0];scenery(w);
  if(state==='play'&&(spd>H*0.55||turbo>0)){ctx.strokeStyle='rgba(255,255,255,.4)';ctx.lineWidth=2;for(var ql=0;ql<12;ql++){var lx=rx+Math.random()*rw,ly=Math.random()*H;ctx.beginPath();ctx.moveTo(lx,ly);ctx.lineTo(lx,ly+40+spd*0.05);ctx.stroke();}}
  items.forEach(drawItem);
  if(state!=='menu'&&state!=='garage'){
    var sh=bump>0?Math.sin(t*50)*5:0;
    if(turbo>0){var cs=['#ff1744','#ff9100','#ffd600','#00e676','#2979ff','#aa00ff'];for(var j=0;j<6;j++){ctx.fillStyle=cs[j];ctx.fillRect(px-cw*0.4+j*cw*0.8/6,cy+ch*0.5,cw*0.8/6,ch*(0.9+Math.random()*0.5));}}
    var c=CARS[S.car];drawCar(px+sh,cy,cw,c.c,c.t);
    pops.forEach(function(p){ctx.globalAlpha=Math.max(0,p.life);ctx.font='bold 22px system-ui';ctx.textAlign='center';ctx.lineWidth=5;ctx.strokeStyle='#fff';ctx.strokeText(p.txt,p.x,p.y);ctx.fillStyle=p.col;ctx.fillText(p.txt,p.x,p.y);ctx.globalAlpha=1;});
    hud();
  }
  if(hintT>0&&state==='play'){ctx.font='bold 20px system-ui';ctx.textAlign='center';ctx.lineWidth=5;ctx.strokeStyle='#fff';ctx.strokeText(T('👆 Води пальцем влево и вправо'),W/2,H*0.5);ctx.fillStyle='#5b2bbf';ctx.fillText(T('👆 Води пальцем влево и вправо'),W/2,H*0.5);}
  ctx.restore();if(state!=='play')overlay();
}

var last=performance.now();
function loop(now){var dt=Math.min(0.05,(now-last)/1000);last=now;if(state==='play')update(dt);else t+=dt;geo();draw();requestAnimationFrame(loop);}
requestAnimationFrame(loop);

cv.addEventListener('pointerdown',function(e){e.preventDefault();initAudio();if(state==='play')carX=e.clientX;});
cv.addEventListener('pointermove',function(e){if(state==='play')carX=e.clientX;});
cv.addEventListener('click',function(e){if(state==='play')return;for(var i=0;i<btns.length;i++){var b=btns[i];if(e.clientX>=b.x&&e.clientX<=b.x+b.w&&e.clientY>=b.y&&e.clientY<=b.y+b.h){b.fn();return;}}});
addEventListener('keydown',function(e){if(e.key==='ArrowLeft')carX-=lw;if(e.key==='ArrowRight')carX+=lw;});
})();
</script>
</body>
</html>
